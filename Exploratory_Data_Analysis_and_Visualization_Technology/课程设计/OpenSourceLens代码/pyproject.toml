[project]
name = "opensource-lens"
version = "0.1.0"
description = "OpenSourceLens Reflex dashboard for GitHub open-source project analytics"
requires-python = ">=3.10"
dependencies = [
    "reflex>=0.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
]
